[package]
name = "nopeekos-kernel"
version = "0.461.0"
edition = "2024"
authors = ["nopeek"]
description = "nopeekOS kernel"

[features]
installer = []
# Bundle the LibreWolf userspace sqfs into the installer kernel binary
# so a fresh USB-stick install has the browser ready without an OTA
# round-trip. Off by default (keeps the regular kernel.efi small);
# enabled by `./build.sh usb-full` / `./build.sh qemu-installer-full`.
bundle-userspace = []

[dependencies]
spin = "0.12"         # Spinlock (no_std mutex)

# forge: our own WASM-to-x86-64 compiler. no_std + alloc, and its only
# dependency is the wasmparser wasmi already brings, so it adds a code
# generator to the tree, not a dependency tree.
forge_core = { path = "../forge/core" }

bitflags = "2.13"     # Flag-basierte Enums

[dependencies.wasmi]
version = "1.1"
default-features = false
features = ["prefer-btree-collections"]

# miniz_oxide: no_std inflate for `Content-Encoding: gzip` on the receive
# path. The same crate iris/wallpaper/beak-engine use for PNG.
[dependencies.miniz_oxide]
version = "0.9"
default-features = false
features = ["with-alloc"]

[dependencies.blake3]
version = "1.8"
default-features = false

# RustCrypto: crypto primitives (no_std). SSE/AVX2 are enabled in the
# target, so the crates' SIMD backends are usable. ChaCha20-Poly1305 and
# X25519 are still hand-rolled (csprng.rs / aead.rs / tls/x25519.rs) and
# could be replaced by the crates.
#
# Held back on purpose; do not update this block on its own.
# RustCrypto split into two incompatible generations:
#
#   sha2 0.10 · hmac/hkdf 0.12 · ecdsa 0.16 · p256/p384 0.13 → digest 0.10, signature 2
#   sha2 0.11 · hmac/hkdf 0.13 · ecdsa 0.17 · p256/p384 0.14 → digest 0.11, signature 3
#
# `rsa` has not released the new generation (it wants digest 0.10 /
# sha2 0.10 / signature <2.3). We need RSA for X.509 chains, so moving
# this block alone drags in both sha2 + digest versions and
# breaks the type match where a Sha384 digest is fed to Pkcs1v15.
# Move all of it together, once rsa ships the new generation.
#
# The symmetric side (aes/aes-gcm/ctr/ghash below) has no digest dep and
# already moved.
[dependencies.sha2]
version = "0.10"
default-features = false
# `oid` feature exposes Sha256/Sha384 as `AssociatedOid`, required by
# `rsa::Pkcs1v15Sign::new::<D>()` to build the DigestInfo prefix.
features = ["oid"]

[dependencies.hmac]
version = "0.12"
default-features = false

[dependencies.hkdf]
version = "0.12"
default-features = false

# ECDSA signature verification (for TLS certificate chain validation)
[dependencies.p256]
version = "0.13"
default-features = false
features = ["ecdsa"]

[dependencies.p384]
version = "0.13"
default-features = false
features = ["ecdsa", "ecdh"]

[dependencies.ecdsa]
version = "0.16"
default-features = false
features = ["verifying"]

# RSA PKCS#1 v1.5 signature verification for X.509 chains.
# Constant-time BigUint via `crypto-bigint`. This crate pins the whole
# hash/signature block above to the old RustCrypto generation; watch it
# for a release past 0.9.
[dependencies.rsa]
version = "0.9"
default-features = false

# AES-256-GCM, the primary symmetric cipher.
# Storage: at-rest encryption of every npkFS blob (HW AES-NI + PCLMULQDQ
# enabled in target-feature, runtime cpufeatures dispatch).
# TLS 1.3: TLS_AES_128_GCM_SHA256 + TLS_AES_256_GCM_SHA384 cipher suites.
[dependencies.aes-gcm]
# polyval 0.7 (under aes-gcm 0.11) prefers AVX-512 and falls back to soft
# code on Atom-class CPUs, where polyval 0.6 used the single-block PCLMULQDQ
# they do accelerate. Check throughput when targeting such a CPU.
version = "0.11"
default-features = false
features = ["aes", "alloc"]

# cpufeatures: runtime CPU feature detection (cached after first call).
# aes-gcm + blake3 use it to dispatch to HW or soft path. The `disk`
# intent queries it directly to print which features are detected.
[dependencies.cpufeatures]
version = "0.3"

# `aes` + `ctr` + `ghash`: direct deps for our own AES-GCM in
# `crypto::aead_hw`. The aes-gcm crate's `ghash` backend is single-block
# PCLMULQDQ, which caps the whole AEAD; aead_hw uses a 4-way aggregated
# GHASH around the same primitives.
[dependencies.aes]
version = "0.9"
default-features = false

[dependencies.ctr]
version = "0.10"
default-features = false

[dependencies.ghash]
version = "0.6"
default-features = false

# Widget pipeline ───────────────────────────────────────────────────────

# postcard: wire format for widget trees (WASM → kernel).
# Version-prefixed, variant-order-stable, no_std + alloc.
[dependencies.postcard]
version = "1.0"
default-features = false
features = ["alloc"]

[dependencies.serde]
version = "1.0"
default-features = false
features = ["alloc", "derive"]

# fontdue: TTF glyph rasterizer for Inter Variable UI font.
# no_std compatible. Variable-axis via `OutlineBuilder` at metrics time.
[dependencies.fontdue]
version = "0.9"
default-features = false
features = ["hashbrown"]

# hashbrown 0.15 replaced the `ahash` feature with `default-hasher`
# (foldhash underneath). fontdue requires ^0.15, so pinning the same
# line here keeps exactly one hashbrown in the tree instead of two.
[dependencies.hashbrown]
version = "0.15"
default-features = false
features = ["default-hasher"]
