    "tools/wasm/wallpaper",
    "tools/wasm/top",
    "tools/wasm/wifi_rtl8822ce",
    "tools/wasm/gpu_intel_tgl",
    "tools/wasm/gpu_amd_renoir",
    "tools/wasm/audio_hda",
    "tools/wasm/audio_acp",
    "tools/wasm/uvc",
    "tools/wasm/debug",
    "tools/wasm/sdk/widgets",
    "tools/wasm/sdk/npk_sys",
    "tools/wasm/extfs/core",
    "tools/wasm/extfs/wasm",
    "tools/wasm/dock",
    "tools/wasm/bar",
    "tools/wasm/deck",
    "tools/wasm/loft",
    "tools/wasm/spell",
    "tools/wasm/pick",
    "tools/wasm/cam",
    "tools/wasm/iris",
    "tools/wasm/helm",
    "tools/wasm/peek",
    "tools/wasm/tune",
    "tools/wasm/snap",
    "tools/wasm/volume",
    "tools/wasm/link",
    "tools/wasm/beak",
    "tools/wasm/beak-engine",
    "tools/wasm/testdisk",
    "tools/wasm/fbench",
    "tools/wasm/acpi/core",
    "tools/wasm/acpi/harness",
    "tools/wasm/acpi/wasm",
    "tools/wasm/i2c_hid/core",
    "tools/wasm/i2c_hid/harness",
    "tools/wasm/i2c_hid/wasm",
    "tools/wasm/wifid/core",
    "tools/wasm/wifid/harness",
    "tools/wasm/wifid/wasm",
    "tools/regen-icons",
    "tools/hpack-test",
