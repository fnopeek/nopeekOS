[package]
name = "gpu_amd_renoir"
version = "0.35.1"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
npk_sys = { path = "../sdk/npk_sys" }
gpu_scene = { path = "../gpu_scene" }
nopeek_widgets = { path = "../sdk/widgets", features = ["heap"] }

[build-dependencies]
nopeek_widgets = { path = "../sdk/widgets" }

[profile.release]
opt-level = "s"
lto = true
strip = true
