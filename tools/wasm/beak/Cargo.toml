[package]
name = "beak"
version = "0.1.31"
edition = "2024"
description = "beak — the native, sandboxed web browser for nopeekOS. See BROWSER.md."

[lib]
crate-type = ["cdylib"]

[dependencies]
nopeek_widgets = { path = "../sdk/widgets" }
beak-engine = { path = "../beak-engine" }
# Real free-list heap: fontdue does heavy transient allocation while parsing
# the font, which a never-freeing bump allocator can't reclaim (OOM).
linked_list_allocator = "0.10"

[dependencies.postcard]
version = "1.0"
default-features = false
features = ["alloc"]

[build-dependencies]
nopeek_widgets = { path = "../sdk/widgets" }

[profile.release]
opt-level = "s"
lto = true
strip = true
