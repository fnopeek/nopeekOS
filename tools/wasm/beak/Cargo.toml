[package]
name = "beak"
version = "0.28.1"
edition = "2024"
description = "beak — the native, sandboxed web browser for nopeekOS. See docs/spec/BROWSER.md."

[lib]
crate-type = ["cdylib"]

[dependencies]
nopeek_widgets = { path = "../sdk/widgets" }
beak-engine = { path = "../beak-engine" }
# Real reclaiming heap: fontdue does heavy transient allocation while parsing
# the fonts, which a never-freeing bump allocator can't reclaim (OOM). talc,
# not linked_list_allocator: the latter is first-fit with an O(n) free-list walk
# per alloc AND per dealloc, so fontdue's ~15k transient per-glyph Vecs fragment
# it into a quadratic crawl. Measured on the six faces: 683 ms and *rising per
# face* (18 → 302 ms) vs talc's 36 ms flat (5.7-6.3 ms each). Under the wasmi
# interpreter that was the difference between a 10 s and a sub-second start.
talc = { version = "5", default-features = false }
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex", "lock_api"] }

[dependencies.postcard]
version = "1.0"
default-features = false
features = ["alloc"]

[build-dependencies]
nopeek_widgets = { path = "../sdk/widgets" }

[profile.release]
opt-level = "s"
lto = true
strip = true
