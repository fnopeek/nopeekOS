[package]
name = "gpu_intel_tgl"
version = "0.32.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
npk_sys = { path = "../sdk/npk_sys" }
nopeek_widgets = { path = "../sdk/widgets", features = ["heap"] }
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex"] }

[build-dependencies]
nopeek_widgets = { path = "../sdk/widgets" }

[profile.release]
opt-level = "s"
lto = true
strip = true
