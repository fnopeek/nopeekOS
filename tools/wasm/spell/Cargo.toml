[package]
name = "spell"
version = "0.15.2"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Text editor with markdown preview — nopeekOS."

[lib]
crate-type = ["cdylib"]

[dependencies]
nopeek_widgets = { path = "../sdk/widgets", features = ["heap"] }

[dependencies.postcard]
version = "1.0"
default-features = false
features = ["alloc"]

[build-dependencies]
nopeek_widgets = { path = "../sdk/widgets" }

[profile.release]
opt-level = "s"
lto = true
strip = true
