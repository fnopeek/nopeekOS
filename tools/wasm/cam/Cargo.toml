[package]
name = "cam"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Camera viewer — nopeekOS."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nopeek_widgets = { path = "../sdk/widgets", features = ["heap", "jpeg"] }
npk_sys = { path = "../sdk/npk_sys" }

[dependencies.postcard]
version = "1.0"
default-features = false
features = ["alloc"]

[build-dependencies]
nopeek_widgets = { path = "../sdk/widgets" }

[profile.release]
opt-level = 3
lto = true
strip = true
