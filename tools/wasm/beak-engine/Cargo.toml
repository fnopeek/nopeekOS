[package]
name = "beak-engine"
version = "0.1.0"
edition = "2024"
description = "Portable browser engine core for beak (nopeekOS) — pure no_std+alloc, host-agnostic. See BROWSER.md §10."

[lib]
# rlib: the nopeek shell (wasm) and native tests both depend on this.

[dependencies]
# fontdue: TTF glyph rasteriser (same crate + version the kernel UI uses).
# no_std, pure Rust → ports to the desktop adapter too (BROWSER.md §10).
# The LAYOUT engine is hand-rolled; fontdue only turns glyph outlines into
# coverage bitmaps (infrastructure, not "the engine").
[dependencies.fontdue]
version = "0.9"
default-features = false
features = ["hashbrown"]

[dependencies.hashbrown]
version = "0.14"
default-features = false
features = ["ahash"]

# miniz_oxide: no_std DEFLATE/inflate for PNG IDAT (same crate iris/wallpaper use).
[dependencies.miniz_oxide]
version = "0.9"
default-features = false
features = ["with-alloc"]

# libm: no_std transcendental math (powf/cbrtf/sinf/cosf) for CSS Color 4
# colour-space conversions (lab/lch/oklab/oklch/color()). Pure Rust.
[dependencies.libm]
version = "0.2"
default-features = false

# zune-jpeg: no_std baseline+progressive JPEG decoder (the common web image
# case). Pure Rust, alloc-only — same "infrastructure decoder" role as
# miniz_oxide for PNG. Output forced to interleaved RGB, we pack to BGRA.
[dependencies.zune-jpeg]
version = "0.4"
default-features = false
[dependencies.zune-core]
version = "0.4"
default-features = false

[features]
# Dev-only: print oversized boxes with the element that made them.
diag-boxes = []
