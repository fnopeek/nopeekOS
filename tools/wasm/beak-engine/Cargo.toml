[package]
name = "beak-engine"
version = "0.1.0"
edition = "2024"
description = "Portable browser engine core for beak (nopeekOS) — pure no_std+alloc, host-agnostic. See docs/spec/BROWSER.md §10."

[lib]
# rlib: the nopeek shell (wasm) and native tests both depend on this.

[dependencies]
# fontdue: TTF glyph rasteriser (same crate + version the kernel UI uses).
# no_std, pure Rust, so it ports to the desktop adapter too (docs/spec/BROWSER.md §10).
# The layout engine is hand-rolled; fontdue only turns glyph outlines into
# coverage bitmaps (infrastructure, not "the engine").
[dependencies.fontdue]
version = "0.9"
default-features = false
features = ["hashbrown"]

# hashbrown 0.15 replaced the `ahash` feature with `default-hasher`
# (foldhash underneath). fontdue requires ^0.15, so pinning the same
# line here keeps exactly one hashbrown in the tree instead of two.
# ttf-parser: the OpenType tables fontdue does not evaluate. Already in the
# tree through fontdue, with the same features, so the direct edge is free.
# Needed for GSUB: fontdue loads ligature glyphs but does not substitute
# (it has no shaper). See `src/gsub.rs`.
[dependencies.ttf-parser]
version = "0.21"
default-features = false
features = ["opentype-layout"]

[dependencies.hashbrown]
version = "0.15"
default-features = false
features = ["default-hasher"]

# miniz_oxide: no_std DEFLATE/inflate for PNG IDAT (same crate iris/wallpaper use).
[dependencies.miniz_oxide]
version = "0.9"
default-features = false
features = ["with-alloc"]

# libm: no_std transcendental math (powf/cbrtf/sinf/cosf) for CSS Color 4
# colour-space conversions (lab/lch/oklab/oklch/color()). Pure Rust.
[dependencies.libm]
version = "0.2"
default-features = false

# zune-jpeg: no_std baseline+progressive JPEG decoder (the common web image
# case). Pure Rust, alloc-only; same "infrastructure decoder" role as
# miniz_oxide for PNG. Output forced to interleaved RGB, we pack to BGRA.
[dependencies.zune-jpeg]
version = "0.5"
default-features = false
[dependencies.zune-core]
version = "0.5"
default-features = false

[features]
# Dev-only: print oversized boxes with the element that made them.
diag-boxes = []
# Dev-only: counts the places where strict mode would behave differently
# from sloppy mode, to see how many test262 failures depend on it (the
# `onlyStrict` flag only says how a test starts). Kept out of the shipped
# module.
strict-probe = []
# Dev-only: counts live `Object`s. A marking pass only finds what is
# reachable; comparing it with the total shows the garbage held in cycles.
# Kept out of the shipped module.
#
# The counters are single-threaded like the engine. With this feature,
# `cargo test` needs `-- --test-threads=1`, otherwise tests race on the
# same `static mut`.
heap-census = []

# brotli-decompressor: WOFF2 compresses its tables with Brotli (RFC 7932).
# Decompressor only; `default-features = false` means no `std`.
[dependencies.brotli-decompressor]
version = "6"
default-features = false

[[example]]
name = "woffcheck"
