[package]
name = "nopeek_widgets"
version = "0.28.0"
edition = "2024"
description = "nopeekOS widget SDK — declarative GUI types for WASM apps."
license = "AGPL-3.0-or-later"

[lib]
# Library for WASM apps to depend on. Apps compile to cdylib; this crate
# provides the types + postcard serialization shared by every GUI app.
crate-type = ["rlib"]

[features]
# Growing heap. Optional because it pulls in `talc`, and a small module is
# served fine by a bump allocator. Enable it if you allocate and free per
# frame.
heap = ["dep:talc", "dep:spin"]

[dependencies]
talc = { version = "5", default-features = false, optional = true }
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex", "lock_api"], optional = true }

[dependencies.serde]
version = "1.0"
default-features = false
features = ["alloc", "derive"]

[dependencies.postcard]
version = "1.0"
default-features = false
features = ["alloc"]

[dev-dependencies]
# Tests run on the host with std; the crate itself stays no_std.
# No extra deps needed; std is picked up automatically under cfg(test).

[profile.release]
opt-level = "s"
lto = true
