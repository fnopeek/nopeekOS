[package]
name = "npk_sys"
version = "0.2.0"
edition = "2024"
description = "nopeekOS host ABI for WASM modules: safe wrappers, no allocator needed."
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["rlib"]

[features]
# `read_all`: grows a buffer to what the host says it needs. Needs a global
# allocator in the module.
alloc = []

[profile.release]
opt-level = "s"
lto = true
