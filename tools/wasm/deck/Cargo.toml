[package]
name = "deck"
version = "0.3.2"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Bottom panel: bar, window list and launcher in one."

[lib]
crate-type = ["cdylib"]

[dependencies]
nopeek_widgets = { path = "../sdk/widgets", features = ["heap"] }

[dependencies.postcard]
version = "1.0"
default-features = false
features = ["alloc"]

[build-dependencies]
nopeek_widgets = { path = "../sdk/widgets" }

[profile.release]
opt-level = "s"
lto = true
strip = true
