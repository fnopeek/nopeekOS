[package]
name = "tune"
version = "0.9.1"
edition = "2024"
description = "tune — audio player for nopeekOS."

[lib]
crate-type = ["cdylib"]

[dependencies]
nopeek_widgets = { path = "../sdk/widgets", features = ["heap"] }
# minimp3 transliterated to Rust: no_std, no allocation, no dependencies,
# no libm; the whole decoder is tables.
nanomp3 = "0.1"
# H.264. Vendored with one patch (see ../vendor/VENDOR.md). `asm` must stay
# off: forge has no simd128, and what forge cannot translate traps.
rusty_h264-decoder = { path = "../vendor/rusty_h264-decoder", default-features = false, features = ["libm"] }
rusty_h264-common  = { path = "../vendor/rusty_h264-common",  default-features = false, features = ["libm"] }
# AAC. Vendored and ported to no_std; see ../vendor/VENDOR.md.
rusty_aac = { path = "../vendor/rusty_aac", default-features = false }

[dependencies.postcard]
version = "1.0"
default-features = false
features = ["alloc"]

[build-dependencies]
nopeek_widgets = { path = "../sdk/widgets", features = ["heap"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
