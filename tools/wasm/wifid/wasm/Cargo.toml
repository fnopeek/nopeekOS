[package]
name = "wifid"
version = "0.19.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
wifid_core = { path = "../core" }
npk_sys = { path = "../../sdk/npk_sys", features = ["alloc"] }
nopeek_widgets = { path = "../../sdk/widgets", features = ["heap"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
