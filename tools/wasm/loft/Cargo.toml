[package]
name = "loft"
version = "0.10.1"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "File browser — Thunar-clone for nopeekOS."

[lib]
crate-type = ["cdylib"]

[dependencies]
nopeek_widgets = { path = "../sdk/widgets", features = ["heap"] }
npk_sys = { path = "../sdk/npk_sys" }

[dependencies.postcard]
version = "1.0"
default-features = false
features = ["alloc"]

[build-dependencies]
nopeek_widgets = { path = "../sdk/widgets" }

[profile.release]
opt-level = "s"
lto = true
strip = true
