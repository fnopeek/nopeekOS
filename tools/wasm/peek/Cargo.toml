[package]
name = "peek"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Security cockpit for nopeekOS: what every app did with its token."

[lib]
crate-type = ["cdylib"]

[dependencies]
nopeek_widgets = { path = "../sdk/widgets", features = ["heap"] }
npk_sys = { path = "../sdk/npk_sys" }

[dependencies.postcard]
version = "1.0"
default-features = false
features = ["alloc"]

[build-dependencies]
nopeek_widgets = { path = "../sdk/widgets" }

[profile.release]
opt-level = "s"
lto = true
strip = true
