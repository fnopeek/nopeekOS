[package]
name = "i2c_hid"
version = "0.30.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
i2c_hid_core = { path = "../core" }
aml_core = { path = "../../acpi/core" }
npk_sys = { path = "../../sdk/npk_sys", features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
