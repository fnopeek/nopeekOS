[package]
name = "i2c_hid"
version = "0.28.2"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
i2c_hid_core = { path = "../core" }
aml_core = { path = "../../aml/core" }
