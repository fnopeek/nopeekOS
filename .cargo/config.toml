# Cargo config for the nopeekOS repo.
#
# The kernel target (+ build-std) is passed explicitly on the CLI by
# build.sh — see the `cargo build` invocations there — so nothing in
# this file forces a global default target.
#
# Keeping `[build]` + `[unstable]` empty here means tools and libraries
# that live in this repo but run on the host (e.g. the widget SDK's
# unit tests under tools/wasm/sdk/widgets/) can invoke `cargo test`
# directly and get the host triple + precompiled std — fast, portable,
# no local overrides needed.
#
# The `[target.x86_64-unknown-none]` block below is a conditional
# table: it only applies when cargo is actually building for the
# bare-metal kernel target (triggered by build.sh's `--target` flag).
# Host-side invocations never see these rustflags.
#
# target-feature overlays the built-in x86_64-unknown-none defaults
# (which force +soft-float / -sse for "no FPU" kernels). We want SSE
# + AVX2 + AES-NI + PCLMUL so the aes-gcm crate compiles in its
# hardware backend (~50× faster than soft AES) and blake3 picks its
# AVX2 backend (~2× faster than SSE4.1, the previous ceiling on read
# throughput). CR0/CR4/XCR0 are configured in boot.s + smp/trampoline.s
# before the first Rust instruction runs (CR4.OSXSAVE + XSETBV with
# x87|SSE|AVX bits is what unlocks the YMM register file).

[target.x86_64-unknown-none]
runner = "bash build.sh run"

# Linker script (path relative to the kernel build's CWD = repo root).
rustflags = [
    "-C", "link-arg=-Tkernel/linker.ld",
    # Position-independent image. We build as a PIE so the linker emits
    # R_X86_64_RELATIVE dynamic relocations for every absolute data
    # pointer (statics holding &str / fn-ptrs, vtables, the .got).
    # boot.s's _start applies them against the actual load address
    # before the first Rust instruction runs, so the firmware may load
    # us at ANY address (RELOCS_STRIPPED cleared, DYNAMIC_BASE set in
    # the PE by tools/pe-fixup.py). Firmware-independent instead of
    # betting that ImageBase (0x10000000) is free on every machine —
    # the old static model bootlooped on firmware whose memory map
    # didn't keep that range free (e.g. some notebooks).
    #
    # pic codegen also makes every in-code address-take RIP-relative
    # (lea instead of mov $imm64), so no source-level fixups are needed
    # for &gdt64 / &__heap_start / addr_of!(IDT) / fn pointers.
    #
    # -znorelro: no dynamic loader to enforce RELRO, and we run
    # identity-mapped. --pack-dyn-relocs=none: force classic .rela.dyn
    # (RELA) instead of compact .relr.dyn, which boot.s's relocation
    # loop knows how to walk.
    "-C", "relocation-model=pic",
    "-C", "link-arg=-pie",
    "-C", "link-arg=-znorelro",
    "-C", "link-arg=--pack-dyn-relocs=none",
    "-C", "target-feature=+sse,+sse2,+ssse3,+sse4.1,+sse4.2,+avx,+avx2,+aes,+pclmulqdq,-soft-float",
]

# Host functions live in the kernel, not in the module: every `npk_*` in an
# `unsafe extern "C"` block is a WASM *import*, resolved by the runtime at
# instantiation. Since nightly 2026-07-30 rust-lld rejects those as undefined
# symbols instead of emitting imports, so every module fails to link from a
# clean target dir (a warm one kept working, which is why this surfaced only
# on a fresh build). Telling the linker they are allowed to be undefined is
# the accurate statement — the ABI check that matters happens in the kernel's
# validator, which refuses to instantiate a module importing anything it does
# not offer.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--allow-undefined"]
